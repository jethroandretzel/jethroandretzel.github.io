<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Great+Vibes&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Jethro & Retzel</title>
</head>


<body>
    <section>
        <div class="save-the-date-section">
            <div class="header-section">
                <h1>
                    Jethro & Retzel
                </h1>
            </div>
            <div class="mid-section">
                <div class="date">
                    <h3 class="month">08.</h3>
                    <h3 class="date1">12.</h3>
                    <h3 class="year">25.</h3>
                </div>
                <div class="save-our-date">
                    <h3 class="save">Save</h3>
                    <h3 class="our">Our</h3>
                    <h3 class="date2">Date</h3>
                </div>
            </div>
            <div class="days-countdown">
                <div class="days-count">
                    <p>127</p>
                </div>
                <div class="days-to-go">
                    <p>days to go</p>
                </div>
            </div>
            <div class="motif-section">
                <div class="motif-title">
                    <p>Motif</p>
                    <span class="line"></span>
                </div>
                <div class="motif-colors">
                    <span class="color1"></span>
                    <span class="color2"></span>
                    <span class="color3"></span>
                    <span class="color4"></span>
                    <span class="color5"></span>
                    <span class="color6"></span>
                    <span class="color7"></span>
                </div>
            </div>
            <div class="location">
                <div class="ceremony">
                    <p>Ceremony</p>
                    <span class="line"></span>
                    <p>St. Francis of Assisi Parish</p>
                </div>
                <div class="reception">
                    <p>Reception</p>
                    <span class="line"></span>
                    <p>Northcrest Clubhouse</p>
                </div>
            </div>
    </section>

    <script src="script.js"></script> 
</body>
</html>
